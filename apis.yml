name: Tellabs
description: 'Tellabs is a networking infrastructure vendor focused on Passive Optical
  LAN (OLAN) and broadband access for enterprises, government, and service providers.
  Its portfolio includes the Passive Optical LAN solution, the Tellabs 1000 MSAP broadband
  digital loop carrier converging legacy copper and fiber, and the Tellabs Panorama
  Element/Integrated Network Manager (EMS/INM) for SDN-style management of optical
  LANs. Tellabs also runs a Technical Assistance Center, professional services, training,
  and a partner program. As of this enrichment pass, Tellabs publishes no public developer
  portal, API reference, or machine-readable API specification; its Panorama products
  reference a North Bound Interface (NBI) for back-office automation, but no OpenAPI/Swagger
  or public API documentation is available.'
